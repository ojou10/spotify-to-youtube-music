[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///playlist_bridge.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[formatters]
keys = generic

[handlers]
keys = console

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
