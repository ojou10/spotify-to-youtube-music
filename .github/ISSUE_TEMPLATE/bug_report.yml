name: Bug report
description: Report a reproducible problem using synthetic or redacted data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tokens, cookies, credentials, private playlists, personal exports, or raw provider responses. Use private vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic or redacted data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Node version, and browser.
  - type: checkboxes
    id: disclosure
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal identifiers, private playlist data, and raw authentication responses.
          required: true
